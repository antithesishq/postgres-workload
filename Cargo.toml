[package]
name = "antigres"
version = "0.1.0"
edition = "2024"

[dependencies]
antithesis_sdk = "0.2.8"
egglog = { git = "https://github.com/teymour-aldridge/egglog", branch="random-walk-extractor" }
postgres = "0.19.12"
r2d2 = "0.8"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.21.0", features = ["v4"] }
threadpool = "1.8"
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh32"] }
r2d2_postgres = "0.18.2"
rand_distr = "0.4.3"
indexmap = "2.13.0"
